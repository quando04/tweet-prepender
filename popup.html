<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Tweet Prepender</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Tweet Prepender</h1>

    <label for="txtPrepended">Text added to the start of each post</label>
    <textarea
      id="txtPrepended"
      placeholder="Prepended text, e.g., Hello!"
      spellcheck="true"
    ></textarea>

    <div class="footer">
      <span
        >Counts toward X's post length limit. Edited posts are left unchanged.
        Leave empty to turn off.</span
      >
      <span id="statusBar" role="status" aria-live="polite"></span>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
